# Feedarte production stack: Postgres + API + worker(s) + Caddy (auto HTTPS) + daily backups.
#   cp .env.example .env   # fill it in
#   docker compose up -d --build
#   docker compose up -d --scale worker=2   # more render capacity

x-app: &app
  build: .
  image: feedarte:latest
  restart: unless-stopped
  env_file: .env
  environment:
    DB_HOST: db
    DB_USER: feedarte
    DB_NAME: feedarte
    NODE_ENV: production
  volumes:
    - appdata:/app/data
    - ${STATUS_DIR:-./status}:/app/status:ro
  depends_on:
    db:
      condition: service_healthy
  logging:
    driver: json-file
    options: { max-size: "20m", max-file: "5" }

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: feedarte
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: feedarte
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U feedarte -d feedarte"]
      interval: 10s
      timeout: 5s
      retries: 10
    shm_size: 256mb
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  app:
    <<: *app
    command: ["node", "dist/server/index.js"]
    expose: ["3000"]

  worker:
    <<: *app
    command: ["node", "dist/server/worker.js"]
    healthcheck:
      disable: true
    stop_grace_period: 30s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
      SITE_DOMAIN: ${SITE_DOMAIN:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./landing:/srv/landing:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [app]

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ${BACKUP_DIR:-./backups}:/backups
      - appdata:/appdata:ro
      - ./deploy/backup.sh:/backup.sh:ro
    entrypoint: ["/bin/sh", "/backup.sh"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  appdata:
  caddy_data:
  caddy_config:
