name: Check & release

# Every push to main is type-checked and built. Only if that succeeds, the commit is
# promoted to the `production` branch — the server auto-deploys from `production`.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npx tsc --noEmit -p .
      - name: Build
        run: npm run build

  release:
    needs: check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Promote to production
        run: git push --force origin HEAD:refs/heads/production
